<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRB Follow Up - Vardiya Raporu</title>
    <!-- Tailwind CSS ve Dark Mode Konfigürasyonu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <!-- ExcelJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <!-- FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans relative bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">

    <!-- Üst Menü -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 flex justify-between items-center shadow-sm z-10 transition-colors duration-200">
        <div>
            <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400"><i class="fas fa-bolt mr-2 text-yellow-500"></i>TRB Otomatik Rapor Paneli</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Ekran görüntüsünü site içinde herhangi bir yere yapıştırın (Ctrl+V)</p>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- Tarih Seçimi -->
            <div class="flex items-center bg-gray-100 dark:bg-gray-700 rounded p-1 border border-gray-300 dark:border-gray-600">
                <i class="far fa-calendar-alt text-gray-500 dark:text-gray-400 ml-2 mr-2"></i>
                <input type="date" id="shiftDate" class="bg-transparent border-none text-gray-800 dark:text-white px-2 py-1 outline-none text-sm font-medium cursor-pointer">
            </div>

            <!-- Vardiya Seçimi -->
            <div class="flex items-center bg-gray-100 dark:bg-gray-700 rounded p-1 border border-gray-300 dark:border-gray-600">
                <i class="fas fa-clock text-gray-500 dark:text-gray-400 ml-2 mr-2"></i>
                <select id="shiftSelect" onchange="changeShift(this.value)" class="bg-transparent border-none text-gray-800 dark:text-white px-2 py-1 outline-none text-sm font-medium cursor-pointer">
                    <option class="text-gray-900 bg-white dark:text-white dark:bg-gray-800" value="07:00-15:00">Vardiya: 07:00 - 15:00</option>
                    <option class="text-gray-900 bg-white dark:text-white dark:bg-gray-800" value="15:00-23:00">Vardiya: 15:00 - 23:00</option>
                    <option class="text-gray-900 bg-white dark:text-white dark:bg-gray-800" value="23:00-07:00">Vardiya: 23:00 - 07:00</option>
                    <option class="text-gray-900 bg-white dark:text-white dark:bg-gray-800" value="07:00-19:00">Vardiya: 07:00 - 19:00</option>
                    <option class="text-gray-900 bg-white dark:text-white dark:bg-gray-800" value="19:00-07:00">Vardiya: 19:00 - 07:00</option>
                </select>
            </div>
            
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-yellow-400 hover:bg-gray-300 dark:hover:bg-gray-600 transition" title="Tema Değiştir">
                <i class="fas fa-sun" id="themeIcon"></i>
            </button>
            
            <div class="h-8 w-px bg-gray-300 dark:bg-gray-600 mx-1"></div>
            
            <button onclick="clearAll()" class="bg-red-100 text-red-600 hover:bg-red-200 dark:bg-red-900/30 dark:text-red-400 dark:hover:bg-red-900/50 px-4 py-2 rounded transition text-sm font-medium border border-red-200 dark:border-red-800/50">
                <i class="fas fa-trash-alt mr-1"></i> Temizle
            </button>
            
            <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-500 text-white px-5 py-2 rounded shadow-md transition text-sm font-bold flex items-center">
                <i class="fas fa-file-excel mr-2 text-lg"></i> Excel'e Aktar
            </button>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="flex-1 overflow-hidden flex">
        
        <!-- Sol Panel -->
        <div class="w-1/4 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 p-4 flex flex-col transition-colors duration-200">
            <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-300 mb-4 border-b border-gray-200 dark:border-gray-800 pb-2">Saat Dilimleri</h2>
            <div id="hourList" class="flex flex-col gap-2 overflow-y-auto pr-2 pb-10">
                <!-- Saatler JS ile eklenecek -->
            </div>
        </div>

        <!-- Sağ Panel -->
        <div class="w-3/4 bg-gray-50 dark:bg-gray-800 p-6 flex flex-col relative transition-colors duration-200" id="contentPanel">
            
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 dark:text-gray-400">
                <div class="bg-white dark:bg-gray-900 p-10 rounded-2xl border border-gray-300 dark:border-gray-700 shadow-xl text-center border-dashed">
                    <i class="fas fa-clipboard text-5xl mb-4 text-blue-500 opacity-80"></i>
                    <h3 class="text-xl font-bold text-gray-700 dark:text-gray-300 mb-2">Başlamak İçin Yapıştır</h3>
                    <p class="text-sm">Panodaki görüntüyü sayfaya yapıştırın (Ctrl+V).</p>
                    <p class="text-sm mt-1 opacity-75">Sistem saat aralığını kendisi hesaplayıp dizecektir.</p>
                </div>
            </div>

            <div id="activeContent" class="h-full flex flex-col hidden">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-300 dark:border-gray-700">
                    <h2 class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="activeHourTitle"></h2>
                    <span class="text-gray-500 dark:text-gray-400 text-sm font-medium" id="itemCountLabel"></span>
                </div>
                
                <div id="itemsGrid" class="flex-1 overflow-y-auto grid grid-cols-1 xl:grid-cols-2 gap-6 content-start pr-2 pb-10">
                    <!-- Resimler ve notlar buraya gelecek -->
                </div>
            </div>
        </div>
    </main>

    <!-- Ctrl+V Yapıştırma Modalı -->
    <div id="pasteModal" class="fixed inset-0 bg-gray-900/50 dark:bg-black/80 flex items-center justify-center hidden z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md border border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white"><i class="fas fa-crop-alt mr-2 text-blue-500 dark:text-blue-400"></i>Görüntü Yakalandı</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white"><i class="fas fa-times text-lg"></i></button>
            </div>
            
            <img id="modalPreview" class="w-full h-48 object-contain bg-gray-100 dark:bg-black rounded mb-5 border border-gray-200 dark:border-gray-900 shadow-inner">
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Bu İşlemin Tam Saati</label>
                <div class="flex items-center bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg p-1 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-colors">
                    <i class="far fa-clock text-gray-400 ml-3 mr-2"></i>
                    <input type="time" id="modalTime" class="w-full bg-transparent border-none text-gray-900 dark:text-white p-2 outline-none text-lg" required>
                </div>
            </div>
            
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-white rounded-lg text-sm font-medium transition">İptal</button>
                <button onclick="savePastedItem()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition shadow-lg shadow-blue-500/30">Hafızaya Ekle</button>
            </div>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('trb_autoItems')) || [];
        let currentShift = localStorage.getItem('trb_currentShift') || '15:00-23:00';
        let activeRange = null; 
        let currentPastedImg = null;

        function init() {
            applyTheme();
            const dateInput = document.getElementById('shiftDate');
            const savedDate = localStorage.getItem('trb_shiftDate');
            if (savedDate) {
                dateInput.value = savedDate;
            } else {
                dateInput.valueAsDate = new Date();
            }
            dateInput.addEventListener('change', (e) => {
                localStorage.setItem('trb_shiftDate', e.target.value);
            });
            document.getElementById('shiftSelect').value = currentShift;
            render();
        }

        function applyTheme() {
            const theme = localStorage.getItem('trb_theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('trb_theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('trb_theme', 'dark');
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (document.documentElement.classList.contains('dark')) {
                icon.className = 'fas fa-moon';
            } else {
                icon.className = 'fas fa-sun';
            }
        }

        function changeShift(newShift) {
            currentShift = newShift;
            localStorage.setItem('trb_currentShift', currentShift);
            render();
        }

        function getShiftStartHour() {
            return parseInt(currentShift.split('-')[0].split(':')[0], 10);
        }

        function timeToMinutes(timeStr) {
            let [h, m] = timeStr.split(':').map(Number);
            const shiftStartHour = getShiftStartHour();
            if (h < shiftStartHour) h += 24; 
            return (h * 60) + m;
        }

        function generateShiftIntervals() {
            const intervals = [];
            const [startStr, endStr] = currentShift.split('-');
            let start = parseInt(startStr.split(':')[0], 10);
            let end = parseInt(endStr.split(':')[0], 10);
            
            let current = start;
            while(current !== end) {
                let next = (current + 1) % 24;
                const pad = (num) => num.toString().padStart(2, '0');
                intervals.push(`${pad(current)}:00 - ${pad(next)}:00`);
                current = next;
            }
            return intervals;
        }

        function calculateRange(timeStr) {
            let [h, m] = timeStr.split(':').map(Number);
            let nextH = (h + 1) % 24;
            let pad = (n) => n.toString().padStart(2, '0');
            return `${pad(h)}:00 - ${pad(nextH)}:00`;
        }

        function saveData() {
            localStorage.setItem('trb_autoItems', JSON.stringify(items));
        }

        function clearAll() {
            if(confirm("Tüm vardiya verilerini temizlemek istediğine emin misin?")) {
                items = [];
                activeRange = null;
                saveData();
                render();
            }
        }

        window.addEventListener('paste', (e) => {
            if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;
            const clipboardItems = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in clipboardItems) {
                const item = clipboardItems[index];
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        currentPastedImg = await resizeImage(event.target.result);
                        document.getElementById('modalPreview').src = currentPastedImg;
                        const now = new Date();
                        document.getElementById('modalTime').value = now.toTimeString().substring(0,5);
                        document.getElementById('pasteModal').classList.remove('hidden');
                        setTimeout(() => {
                            const timeInput = document.getElementById('modalTime');
                            timeInput.focus();
                            timeInput.select();
                        }, 100);
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        document.getElementById('modalTime').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') savePastedItem();
        });

        function closeModal() {
            document.getElementById('pasteModal').classList.add('hidden');
            currentPastedImg = null;
        }

        function savePastedItem() {
            const timeVal = document.getElementById('modalTime').value;
            if(!timeVal) { alert("Lütfen saat formatını girin (Örn: 16:07)"); return; }
            const range = calculateRange(timeVal);
            items.push({
                id: Date.now(),
                time: timeVal,
                range: range,
                src: currentPastedImg,
                note: '',
                status: 'info'
            });
            saveData();
            closeModal();
            activeRange = range; 
            render();
        }

        function setActive(range) {
            activeRange = range;
            render();
        }

        function updateItem(id, field, value) {
            const itemIndex = items.findIndex(i => i.id === id);
            if(itemIndex > -1) {
                items[itemIndex][field] = value;
                saveData();
            }
        }

        function deleteItem(id) {
            if(confirm("Bu kaydı silmek istiyor musunuz?")) {
                items = items.filter(i => i.id !== id);
                saveData();
                render();
            }
        }

        function render() {
            const hourList = document.getElementById('hourList');
            const itemsGrid = document.getElementById('itemsGrid');
            const emptyState = document.getElementById('emptyState');
            const activeContent = document.getElementById('activeContent');
            const activeHourTitle = document.getElementById('activeHourTitle');
            const itemCountLabel = document.getElementById('itemCountLabel');

            const standardIntervals = generateShiftIntervals();
            items.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

            const grouped = {};
            standardIntervals.forEach(r => grouped[r] = []);
            items.forEach(item => {
                if(!grouped[item.range]) grouped[item.range] = [];
                grouped[item.range].push(item);
            });

            const allRanges = Object.keys(grouped).sort((a, b) => timeToMinutes(a.substring(0,5)) - timeToMinutes(b.substring(0,5)));
            if (!activeRange && allRanges.length > 0) activeRange = allRanges[0];

            hourList.innerHTML = '';
            allRanges.forEach(range => {
                const rangeItems = grouped[range];
                const isActive = range === activeRange;
                if(rangeItems.length > 0 || standardIntervals.includes(range)) {
                    const div = document.createElement('div');
                    const activeClasses = 'bg-blue-50 border-blue-500 shadow-md shadow-blue-100 dark:shadow-none dark:bg-blue-900/60 dark:border-blue-400';
                    const inactiveClasses = 'bg-white border-gray-200 hover:bg-gray-50 hover:border-gray-300 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 dark:hover:border-gray-500';
                    const textClasses = isActive ? 'text-blue-700 dark:text-blue-200 font-bold' : 'text-gray-700 dark:text-gray-300 font-medium';
                    const badgeClasses = rangeItems.length > 0 ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-500 dark:bg-gray-700 dark:text-gray-400';

                    div.className = `p-3 rounded-xl cursor-pointer flex justify-between items-center border transition-all duration-200 ${isActive ? activeClasses : inactiveClasses}`;
                    div.onclick = () => setActive(range);
                    div.innerHTML = `
                        <div class="flex items-center ${textClasses}">
                            <i class="fas ${isActive ? 'fa-folder-open text-blue-500' : 'fa-folder text-gray-400'} mr-3 text-sm"></i>
                            ${range}
                        </div>
                        <span class="${badgeClasses} text-xs px-2.5 py-1 rounded-full font-bold">
                            ${rangeItems.length}
                        </span>
                    `;
                    hourList.appendChild(div);
                }
            });

            if (activeRange && grouped[activeRange] && grouped[activeRange].length > 0) {
                emptyState.classList.add('hidden');
                activeContent.classList.remove('hidden');
                activeHourTitle.textContent = activeRange;
                itemCountLabel.textContent = `${grouped[activeRange].length} İşlem Kaydı`;
                itemsGrid.innerHTML = '';
                
                grouped[activeRange].forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 flex flex-col overflow-hidden shadow hover:shadow-lg transition-shadow h-[450px]";
                    card.innerHTML = `
                        <div class="flex-none bg-gray-50 dark:bg-gray-800 p-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-blue-600 dark:text-blue-300 font-mono text-sm px-2 py-1 rounded shadow-sm">
                                    <i class="far fa-clock mr-1"></i> ${item.time}
                                </span>
                                <select onchange="updateItem(${item.id}, 'status', this.value)" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-2 py-1 text-sm outline-none focus:border-blue-400 text-gray-800 dark:text-white font-medium cursor-pointer">
                                    <option value="info" ${item.status === 'info' ? 'selected' : ''}>🔵 BİLGİ</option>
                                    <option value="warning" ${item.status === 'warning' ? 'selected' : ''}>🟡 UYARI</option>
                                    <option value="critical" ${item.status === 'critical' ? 'selected' : ''}>🔴 KRİTİK</option>
                                    <option value="action" ${item.status === 'action' || item.status === 'resolved' ? 'selected' : ''}>🛠️ AKSİYON</option>
                                </select>
                            </div>
                            <button onclick="deleteItem(${item.id})" class="text-red-500 hover:text-red-600 dark:text-red-400 dark:hover:text-red-300 hover:bg-red-50 dark:hover:bg-red-900/30 p-1.5 rounded transition"><i class="fas fa-trash"></i></button>
                        </div>
                        <div class="flex-1 min-h-0 overflow-auto p-3 bg-gray-100 dark:bg-gray-900 flex justify-center items-start">
                            <img src="${item.src}" class="max-w-full h-auto object-contain rounded border border-gray-300 dark:border-gray-700 shadow-sm" alt="Ekran Görüntüsü">
                        </div>
                        <div class="flex-none p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                            <textarea onchange="updateItem(${item.id}, 'note', this.value)" placeholder="Bu işlem için notlarınızı ekleyin..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg p-3 text-sm h-24 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none text-gray-800 dark:gray-200 transition-colors">${item.note}</textarea>
                        </div>
                    `;
                    itemsGrid.appendChild(card);
                });
            } else if (items.length > 0 || standardIntervals.includes(activeRange)) {
                emptyState.classList.add('hidden');
                activeContent.classList.remove('hidden');
                activeHourTitle.textContent = activeRange;
                itemCountLabel.textContent = "0 İşlem Kaydı";
                itemsGrid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400 dark:text-gray-500">
                        <i class="fas fa-inbox text-5xl mb-4 opacity-50"></i>
                        <p>Bu saat aralığı için henüz kayıt yok.</p>
                        <p class="text-sm mt-1">Bu aralığa ait bir görüntü yapıştırdığınızda burada görünecektir.</p>
                    </div>
                `;
            } else {
                emptyState.classList.remove('hidden');
                activeContent.classList.add('hidden');
            }
        }

        function resizeImage(base64Str, maxWidth = 1920) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.naturalWidth || img.width;
                    let height = img.naturalHeight || img.height;
                    if (!width || !height) {
                        reject(new Error("Görüntü boyutları okunamadı."));
                        return;
                    }
                    if (width > maxWidth) {
                        const ratio = maxWidth / width;
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d', { alpha: false });
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.95));
                };
                img.onerror = () => reject(new Error("Görüntü işlenemedi."));
                img.src = base64Str;
            });
        }

        function getImageDimensions(base64Str) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({
                    width: img.naturalWidth || img.width,
                    height: img.naturalHeight || img.height
                });
                img.onerror = () => reject(new Error("Görüntü boyutları okunamadı."));
                img.src = base64Str;
            });
        }

        function createStatusBadgeImage(statusKey) {
            const canvas = document.createElement('canvas');
            canvas.width = 240;
            canvas.height = 70;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const config = {
                'info': { emoji: '🔵', text: 'BİLGİ' },
                'warning': { emoji: '🟡', text: 'UYARI' },
                'critical': { emoji: '🔴', text: 'KRİTİK' },
                'action': { emoji: '🛠️', text: 'AKSİYON' },
                'resolved': { emoji: '🛠️', text: 'AKSİYON' }
            };
            const item = config[statusKey] || config['info'];
            ctx.font = 'bold 32px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(`${item.emoji}  ${item.text}`, canvas.width / 2, canvas.height / 2);
            return canvas.toDataURL('image/png');
        }

        // MÜKEMMEL DİKEY KART FORMATI (DİNAMİK YÜKSEKLİK İLE ÇAKIŞMA ÖNLENDİ)
        async function exportToExcel() {
            if(items.length === 0) {
                alert("Dışa aktarılacak veri bulunamadı.");
                return;
            }

            const workbook = new ExcelJS.Workbook();
            workbook.creator = 'Vardiya Raporu Aracı';

            const grouped = {};
            items.forEach(item => {
                if(!grouped[item.range]) grouped[item.range] = [];
                grouped[item.range].push(item);
            });

            const allRanges = Object.keys(grouped).sort(
                (a, b) => timeToMinutes(a.substring(0,5)) - timeToMinutes(b.substring(0,5))
            );

            const TARGET_IMG_WIDTH_PX = 600; // Geniş ve net ekran görüntüsü genişliği
            const BADGE_WIDTH_PX = 110;
            const BADGE_HEIGHT_PX = 32;

            for (const range of allRanges) {
                const rangeItems = grouped[range];
                rangeItems.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

                const safeSheetName = range
                    .replace(/:/g, '.')
                    .replace(/[/\\?*\[\]]/g, '-')
                    .substring(0, 31);

                const worksheet = workbook.addWorksheet(safeSheetName);

                // Sabit Sütun Genişlikleri (Dikey Blok Düzeni)
                worksheet.columns = [
                    { width: 18 }, // A Sütunu: Etiket / Başlık
                    { width: 85 }  // B Sütunu: Değer / İçerik / Görsel / Açıklama
                ];

                let currentRow = 1;

                const measuredItems = await Promise.all(
                    rangeItems.map(async (item) => {
                        const dimensions = await getImageDimensions(item.src);
                        return {
                            ...item,
                            imageWidth: dimensions.width,
                    imageHeight: dimensions.height,
                            aspect: dimensions.height / dimensions.width
                        };
                    })
                );

                for (let i = 0; i < measuredItems.length; i++) {
                    const item = measuredItems[i];

                    // Her kart arasında boşluk bırak (ilk kart hariç)
                    if (i > 0) {
                        currentRow++;
                        const emptyRow = worksheet.getRow(currentRow);
                        emptyRow.height = 15;
                        currentRow++;
                    } else {
                        currentRow = 1;
                    }

                    const cardStartRow = currentRow;

                    // 1. Satır: SAAT
                    const r1 = worksheet.getRow(currentRow);
                    r1.height = 25;
                    r1.getCell(1).value = "İŞLEM SAATİ";
                    r1.getCell(2).value = item.time;
                    
                    r1.getCell(1).font = { name: 'Calibri', bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
                    r1.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C2833' } };
                    r1.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };

                    r1.getCell(2).font = { name: 'Calibri', bold: true, size: 11, color: { argb: 'FF1F618D' } };
                    r1.getCell(2).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    currentRow++;

                    // 2. Satır: DURUM (Rozet)
                    const r2 = worksheet.getRow(currentRow);
                    r2.height = 35;
                    r2.getCell(1).value = "DURUM";
                    r2.getCell(2).value = ""; // Görsel yerleşecek

                    r2.getCell(1).font = { name: 'Calibri', bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
                    r2.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C2833' } };
                    r2.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };

                    const badgeDataUrl = createStatusBadgeImage(item.status);
                    const badgeImageId = workbook.addImage({ base64: badgeDataUrl, extension: 'png' });
                    
                    worksheet.addImage(badgeImageId, {
                        tl: { col: 1, row: currentRow - 1, nativeCellOffset: { x: 15 * 9525, y: 3 * 9525 } },
                        ext: { width: BADGE_WIDTH_PX, height: BADGE_HEIGHT_PX },
                        editAs: 'oneCell'
                    });
                    currentRow++;

                    // 3. Satır: EKRAN GÖRÜNTÜSÜ (Dinamik Yükseklik Hesaplama)
                    const targetHeightPx = TARGET_IMG_WIDTH_PX * item.aspect;
                    // Excel satır yüksekliği puan (pt) cinsindendir. 1 piksel yaklaşık 0.75 pt'dir.
                    const imgRowHeightPt = Math.max(40, targetHeightPx * 0.95);

                    const r3 = worksheet.getRow(currentRow);
                    r3.height = imgRowHeightPt; // Dinamik olarak görsel boyutuyla birebir eşleştirildi
                    r3.getCell(1).value = "GÖRÜNTÜ";
                    r3.getCell(2).value = ""; // Görsel yerleşecek

                    r3.getCell(1).font = { name: 'Calibri', bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
                    r3.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C2833' } };
                    r3.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };

                    const imageId = workbook.addImage({ base64: item.src, extension: 'jpeg' });
                    worksheet.addImage(imageId, {
                        tl: { col: 1, row: currentRow - 1, nativeCellOffset: { x: 10 * 9525, y: 5 * 9525 } },
                        ext: { width: TARGET_IMG_WIDTH_PX, height: targetHeightPx },
                        editAs: 'oneCell'
                    });
                    currentRow++;

                    // 4. Satır: NOTLAR / AÇIKLAMA (Artık asla üst üste binmeyecek)
                    const r4 = worksheet.getRow(currentRow);
                    r4.height = 65;
                    r4.getCell(1).value = "NOTLAR / AÇIKLAMA";
                    r4.getCell(2).value = item.note || '';

                    r4.getCell(1).font = { name: 'Calibri', bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
                    r4.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C2833' } };
                    r4.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' };

                    r4.getCell(2).font = { name: 'Calibri', size: 11, color: { argb: 'FF000000' } };
                    r4.getCell(2).alignment = { vertical: 'top', horizontal: 'left', wrapText: true, indent: 1 };
                    
                    // Kartın tüm hücrelerine çerçeve ekle (Dış çerçeve kalın siyah)
                    for (let r = cardStartRow; r <= currentRow; r++) {
                        for (let c = 1; c <= 2; c++) {
                            let cellBorder = {
                                top: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                                left: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                                bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                                right: { style: 'thin', color: { argb: 'FFCBD5E1' } }
                            };

                            // Sadece alanın en dış köşelerine kalın (thick) siyah çerçeve uygula
                            if (r === cardStartRow) cellBorder.top = { style: 'thick', color: { argb: 'FF000000' } };
                            if (r === currentRow) cellBorder.bottom = { style: 'thick', color: { argb: 'FF000000' } };
                            if (c === 1) cellBorder.left = { style: 'thick', color: { argb: 'FF000000' } };
                            if (c === 2) cellBorder.right = { style: 'thick', color: { argb: 'FF000000' } };

                            worksheet.getRow(r).getCell(c).border = cellBorder;
                        }
                    }

                    currentRow++;
                }
            }

            const buffer = await workbook.xlsx.writeBuffer();
            const dateInput = document.getElementById('shiftDate').value;
            let dateStr = "";
            if (dateInput) {
                const d = new Date(dateInput);
                dateStr = `${d.getDate()}-${d.getMonth() + 1}-${d.getFullYear()}`;
            } else {
                const d = new Date();
                dateStr = `${d.getDate()}-${d.getMonth() + 1}-${d.getFullYear()}`;
            }
            const [sHour, eHour] = currentShift.split('-');
            const shiftName = `${sHour.split(':')[0]}-${eHour.split(':')[0]}`;

            saveAs(
                new Blob([buffer]),
                `TRB Follow Up (${dateStr}) - ${shiftName}.xlsx`
            );
        }

        init();
    </script>
</body>
</html>
