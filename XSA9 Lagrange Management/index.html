                { t: "10.30 - 12.00", r: 0.7, dur: 1.5, multiPct: 0.6 }, { t: "12.00 - 12.30", r: 0, dur: 0.5, multiPct: 0.6 }, { t: "12.30 - 2.15", r: 0.775, dur: 1.75, multiPct: 0.6 },

            ]
        ];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('start-date').valueAsDate = new Date();
            generateDailyTable();
            renderLagrangeTables();
        });

        function generateDailyTable() {
            const days = parseInt(document.getElementById('day-count').value) || 21;
            const startDateInput = document.getElementById('start-date').value;
            let startDate = startDateInput ? new Date(startDateInput) : new Date();
            
            let theadHtml = `<tr><th class="p-3 border-r border-slate-200 dark:border-slate-700 w-36 bg-slate-100 dark:bg-slate-700 sticky left-0 z-10">Metrik</th>`;
            let inputHtml = `<tr><td class="p-3 border-r border-slate-200 dark:border-slate-700 font-medium bg-white dark:bg-slate-800 sticky left-0 z-10">Kapasite</td>`;
            let resultHtml = `<tr><td class="p-3 border-r border-blue-100 dark:border-blue-900 font-bold bg-[#0ea5e9] text-white sticky left-0 z-10" id="multiplier-label">*1,12</td>`;

            for (let i = 0; i < days; i++) {
                let d = new Date(startDate);
                d.setDate(d.getDate() + i);
                let dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                let cleanDate = dateStr.replace(' ', '-');
                
                theadHtml += `<th class="p-3 text-center min-w-[100px] bg-orange-100/60 dark:bg-orange-950/40 text-slate-700 dark:text-orange-200 border-r border-slate-200 dark:border-slate-700" data-date-index="${i}">${cleanDate}</th>`;
                
                inputHtml += `<td class="p-2 border-r border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors" id="cap-cell-${i}" onclick="handleCapacityClick(${i}, '${cleanDate}')">
                    <input type="number" class="w-full text-center p-1 font-semibold text-slate-800 dark:text-slate-100 bg-transparent outline-none rounded table-input daily-val" data-index="${i}" oninput="calculateDailyResults()" onpaste="handleExcelPaste(event, ${i})">
                </td>`;
                
                resultHtml += `<td class="p-3 text-center font-bold text-white bg-[#0ea5e9] border-r border-blue-400/30 cursor-pointer hover:bg-blue-600 transition-colors result-cell" id="res-${i}" onclick="handleResultCellClick(${i}, '${cleanDate}')"></td>`;
            }
            
            theadHtml += `</tr>`;
            inputHtml += `</tr>`;
            resultHtml += `</tr>`;

            document.getElementById('daily-thead').innerHTML = theadHtml;
            document.getElementById('daily-tbody').innerHTML = inputHtml + resultHtml;
            calculateDailyResults();
        }

        function clearActiveSelection() {
            if (!selectedCell) return;
            if (selectedCell.type === 'raw') {
                const cell = document.getElementById(`cap-cell-${selectedCell.index}`);
                if (cell) cell.classList.remove('selected-active-cell');
            } else if (selectedCell.type === 'calculated') {
                const cell = document.getElementById(`res-${selectedCell.index}`);
                if (cell) cell.classList.remove('selected-active-cell');
            }
        }

        function handleCapacityClick(index, dateStr) {
            const rawInput = document.querySelector(`.daily-val[data-index="${index}"]`);
            const rawVal = parseFloat(rawInput.value);

            if (isNaN(rawVal)) return;

            if (selectedCell && selectedCell.index === index && selectedCell.type === 'raw') {
                clearActiveSelection();
                selectedCell = null;
                return;
            }

            clearActiveSelection();

            selectedCell = {
                index: index,
                dateStr: dateStr,
                type: 'raw'
            };

            const cell = document.getElementById(`cap-cell-${index}`);
            if (cell) cell.classList.add('selected-active-cell');
        }

        function handleResultCellClick(index, dateStr) {
            const rawInput = document.querySelector(`.daily-val[data-index="${index}"]`);
            const rawVal = parseFloat(rawInput.value);

            if (isNaN(rawVal)) return;

            if (selectedCell && selectedCell.index === index && selectedCell.type === 'calculated') {
                clearActiveSelection();
                selectedCell = null;
                return;
            }

            clearActiveSelection();

            selectedCell = {
                index: index,
                dateStr: dateStr,
                type: 'calculated'
            };

            const cell = document.getElementById(`res-${index}`);
            if (cell) cell.classList.add('selected-active-cell');
        }

        function applyToLagrangeTable(tableIndex) {
            if (!selectedCell) {
                alert("Önce üst tablodaki kapasite veya sonuç hücrelerinden birine tıklayarak seçmelisiniz!");
                return;
            }

            const idx = selectedCell.index;
            const dateStr = selectedCell.dateStr;
            const rawInput = document.querySelector(`.daily-val[data-index="${idx}"]`);
            const rawVal = parseFloat(rawInput.value);

            if (isNaN(rawVal)) return;

            let valueToApply = rawVal;
            if (selectedCell.type === 'calculated') {
                const multiplier = parseFloat(document.getElementById('global-multiplier').value) || 1;
                valueToApply = Math.round(rawVal * multiplier);
            }

            tableCapacities[tableIndex] = valueToApply;
            tableDates[tableIndex] = dateStr;

            const capInput = document.getElementById(`l-table-${tableIndex}-cap-input`);
            if (capInput) capInput.value = valueToApply;

            const titleEl = document.getElementById(`l-table-${tableIndex}-title`);
            if (titleEl) {
                titleEl.innerText = `Tablo ${tableIndex + 1} - ${dateStr}`;
            }

            calcLagrange(tableIndex, valueToApply);
        }

        function handleManualCapacity(tableIndex, value) {
            tableDates[tableIndex] = ""; 
            const titleEl = document.getElementById(`l-table-${tableIndex}-title`);
            if (titleEl) {
                titleEl.innerText = `Tablo ${tableIndex + 1}`;
            }
            calcLagrange(tableIndex, value);
        }

        function handleExcelPaste(e, startIndex) {
            e.preventDefault();
            let clipboardData = e.clipboardData || window.clipboardData;
            let pastedText = clipboardData.getData('Text');
            let numbers = pastedText.split(/[\t\n\r]+/).map(item => item.trim()).filter(item => item !== "" && !isNaN(item));
            
            if (numbers.length === 0) return;

            const inputs = document.querySelectorAll('.daily-val');
            let currentIdx = startIndex;

            numbers.forEach(num => {
                if (currentIdx < inputs.length) {
                    inputs[currentIdx].value = num;
                    currentIdx++;
                }
            });

            calculateDailyResults();
        }

        function calculateDailyResults() {
            const multiplier = parseFloat(document.getElementById('global-multiplier').value) || 1;
            document.getElementById('multiplier-label').innerText = `*${multiplier.toString().replace('.', ',')}`;
            
            const inputs = document.querySelectorAll('.daily-val');
            inputs.forEach(input => {
                const val = parseFloat(input.value);
                const idx = input.getAttribute('data-index');
                const resCell = document.getElementById(`res-${idx}`);
                
                if (!isNaN(val)) {
                    resCell.innerText = Math.round(val * multiplier).toLocaleString('tr-TR');
                } else {
                    resCell.innerText = '';
                    if (selectedCell && selectedCell.index == idx) {
                        clearActiveSelection();
                        selectedCell = null;
                    }
                }
            });
        }

        function renderLagrangeTables() {
            const grid = document.getElementById('lagrange-grid');
            grid.innerHTML = '';
            
            lagrangeTemplates.forEach((data, index) => {
                const tableId = `l-table-${index}`;
                const effectiveHours = data.reduce((sum, row) => sum + (row.r > 0 ? row.dur : 0), 0);
                const assignedDate = tableDates[index] ? ` - ${tableDates[index]}` : '';
                
                let tbodyHtml = '';
                data.forEach((row, rIdx) => {
                    const isBreak = row.r === 0;
                    const isNonBreak = row.dur !== 0.25 && row.dur !== 0.5;

                    tbodyHtml += `
                        <tr class="${isBreak ? 'bg-slate-50 dark:bg-slate-900/30 text-slate-400 dark:text-slate-500' : isNonBreak ? 'bg-amber-50/70 dark:bg-amber-950/20 font-medium' : 'bg-white dark:bg-slate-800'} border-b border-slate-100 dark:border-slate-700/60 transition-colors">
                            <td class="px-3 py-1.5 whitespace-nowrap flex items-center space-x-2">
                                ${isNonBreak && !isBreak ? '<span class="w-2 h-2 rounded-full bg-amber-500 shrink-0" title="Mola saati olmayan aktif slot"></span>' : ''}
                                <span class="${isNonBreak && !isBreak ? 'font-bold text-amber-800 dark:text-amber-300' : ''}">${row.t}</span>
                            </td>
                            <td class="px-2 py-1 text-center">
                                <input type="number" step="0.001" value="${row.r}" 
                                       oninput="updateRate(${index}, ${rIdx}, this.value)" 
                                       class="w-16 text-center bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded py-0.5 text-xs font-semibold outline-none focus:border-blue-500">
                            </td>
                            <td class="px-3 py-1.5 text-right text-indigo-600 dark:text-indigo-400 font-semibold" id="${tableId}-lagrange-${rIdx}">0</td>
                            <td class="px-3 py-1.5 text-right text-slate-700 dark:text-slate-300" id="${tableId}-multi-${rIdx}">0</td>
                            <td class="px-3 py-1.5 text-right text-slate-700 dark:text-slate-300" id="${tableId}-single-${rIdx}">0</td>
                            <td class="px-2 py-1 text-center">
                                <div class="flex items-center justify-center space-x-1">
                                    <input type="number" step="1" min="0" max="100" value="${Math.round(row.multiPct * 100)}" 
                                           oninput="updateMultiPct(${index}, ${rIdx}, this.value)" 
                                           class="w-12 text-center bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded py-0.5 text-xs outline-none focus:border-blue-500 font-semibold text-slate-600 dark:text-slate-300">
                                    <span class="text-[10px] text-slate-400">%</span>
                                </div>
                            </td>
                            <td class="px-3 py-1.5 text-center text-slate-500 dark:text-slate-400">${row.dur}</td>
                            <td class="px-3 py-1.5 text-right font-bold text-emerald-600 dark:text-emerald-400" id="${tableId}-total-${rIdx}">0</td>
                        </tr>
                    `;
                });

                const cardHtml = `
                    <div id="l-card-${index}" onclick="applyToLagrangeTable(${index})" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border-2 border-slate-200 dark:border-slate-700 hover:border-blue-400 dark:hover:border-blue-500 cursor-pointer overflow-hidden flex flex-col transition-all group relative">
                        <div class="bg-slate-800 dark:bg-slate-900 text-white p-4 flex flex-col sm:flex-row justify-between items-center gap-4 pointer-events-none">
                            <div>
                                <h3 class="font-bold text-lg" id="${tableId}-title">Tablo ${index + 1}${assignedDate}</h3>
                                <p class="text-slate-400 text-xs">Aktif Süre: ${effectiveHours} Saat (Kapasite uygulamak için tıklayın)</p>
                            </div>
                            <div class="flex items-center space-x-2 bg-slate-700 dark:bg-slate-800 p-2 rounded-lg border border-slate-600 dark:border-slate-700 pointer-events-auto" onclick="event.stopPropagation()">
                                <label class="text-sm font-medium text-slate-300 whitespace-nowrap hidden sm:block">Kapasite / Gün:</label>
                                <input type="number" id="${tableId}-cap-input" value="${tableCapacities[index] || ''}" 
                                       oninput="handleManualCapacity(${index}, this.value)" 
                                       placeholder="Örn: 180" 
                                       class="w-20 bg-slate-900 dark:bg-slate-950 border-none rounded text-white px-2 py-1 outline-none focus:ring-1 focus:ring-blue-400 text-right font-bold">
                                
                                <!-- PDF Dışa Aktarma Butonu -->
                                <button onclick="exportTableToPDF(${index}, event)" class="bg-rose-500/90 hover:bg-rose-500 text-white p-1.5 rounded transition-colors flex items-center justify-center ml-1" title="Tabloyu PDF Olarak Kaydet">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </button>
                            </div>
                        </div>

                        <div class="overflow-x-auto flex-grow pointer-events-auto" onclick="event.stopPropagation()">
                            <table class="w-full text-xs text-left">
                                <thead class="bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700 uppercase">
                                    <tr>
                                        <th class="px-3 py-2">Saat Dilimi</th>
                                        <th class="px-3 py-2 text-center">Rate</th>
                                        <th class="px-3 py-2 text-right">Lagrange Hr</th>
                                        <th class="px-3 py-2 text-right">Multi</th>
                                        <th class="px-3 py-2 text-right">Single</th>
                                        <th class="px-3 py-2 text-center">Multi Oran</th>
                                        <th class="px-3 py-2 text-center">Süre</th>
                                        <th class="px-3 py-2 text-right">Toplam</th>
                                    </tr>
                                </thead>
                                <tbody>${tbodyHtml}</tbody>
                                <tfoot class="bg-slate-50 dark:bg-slate-900/50 font-bold border-t-2 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200">
                                    <tr>
                                        <td colspan="7" class="px-3 py-2 text-right">GENEL TOPLAM ÇIKTI:</td>
                                        <td class="px-3 py-2 text-right text-emerald-700 dark:text-emerald-400 text-sm" id="${tableId}-grandTotal">0</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
                
                if (tableCapacities[index] > 0) {
                    calcLagrange(index, tableCapacities[index]);
                }
            });
        }

        // PDF İndirme ve Konum Seçme Fonksiyonu
        async function exportTableToPDF(tableIndex, event) {
            if (event) event.stopPropagation();

            const element = document.getElementById(`l-card-${tableIndex}`);
            const titleEl = document.getElementById(`l-table-${tableIndex}-title`);
            
            let filename = `Lagrange_Tablo_${tableIndex + 1}.pdf`;
            if (titleEl && titleEl.innerText) {
                filename = `${titleEl.innerText.replace(/[^a-zA-Z0-9_-]/g, "_")}.pdf`;
            }

            const originalClasses = element.className;
            element.classList.remove('hover:border-blue-400', 'dark:hover:border-blue-500', 'cursor-pointer');
            
            const opt = {
                margin:       [10, 5, 10, 5], 
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    scrollX: 0,
                    scrollY: 0,
                    onclone: (clonedDoc) => {
                        const clonedElement = clonedDoc.getElementById(`l-card-${tableIndex}`);
                        clonedElement.style.width = '1000px'; 
                        clonedElement.style.maxWidth = '1000px';
                        clonedElement.style.margin = '0';
                        
                        const overflowDiv = clonedElement.querySelector('.overflow-x-auto');
                        if (overflowDiv) {
                            overflowDiv.classList.remove('overflow-x-auto');
                            overflowDiv.style.overflow = 'visible';
                        }
                        clonedElement.classList.remove('hover:border-blue-400', 'dark:hover:border-blue-500', 'cursor-pointer');
                    }
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            try {
                // PDF'i bellekte Blob nesnesi olarak oluşturuyoruz
                const pdfBlob = await html2pdf().set(opt).from(element).outputPdf('blob');

                // Kullanıcının kayıt yeri ve klasör seçebilmesi için File System Access API kontrolü
                if ('showSaveFilePicker' in window) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{
                            description: 'PDF Dosyası',
                            accept: { 'application/pdf': ['.pdf'] },
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(pdfBlob);
                    await writable.close();
                } else {
                    // API desteklemeyen tarayıcılar için standart indirme yöntemi yedek olarak çalışır
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(pdfBlob);
                    link.download = filename;
                    link.click();
                    URL.revokeObjectURL(link.href);
                }
            } catch (err) {
                // Kullanıcı kaydetme penceresini iptal ederse hata fırlatılır, bunu yoksayıyoruz
                if (err.name !== 'AbortError') {
                    console.error("PDF kaydetme işleminde hata oluştu:", err);
                }
            } finally {
                element.className = originalClasses;
            }
        }

        function updateRate(tableIndex, rowIndex, value) {
            const val = parseFloat(value);
            lagrangeTemplates[tableIndex][rowIndex].r = isNaN(val) ? 0 : val;
            calcLagrange(tableIndex, tableCapacities[tableIndex]);
        }

        function updateMultiPct(tableIndex, rowIndex, value) {
            let val = parseFloat(value);
            if (isNaN(val)) val = 60;
            if (val < 0) val = 0;
            if (val > 100) val = 100;
            
            lagrangeTemplates[tableIndex][rowIndex].multiPct = val / 100;
            calcLagrange(tableIndex, tableCapacities[tableIndex]);
        }

        function calcLagrange(tableIndex, capacityVal) {
            const capacity = parseFloat(capacityVal) || 0;
            tableCapacities[tableIndex] = capacity;
            
            const data = lagrangeTemplates[tableIndex];
            const tableId = `l-table-${tableIndex}`;
            const effectiveHours = data.reduce((sum, row) => sum + (row.r > 0 ? row.dur : 0), 0);
            
            let grandTotal = 0;

            if (capacity <= 0 || effectiveHours === 0) {
                data.forEach((row, rIdx) => {
                    document.getElementById(`${tableId}-lagrange-${rIdx}`).innerText = "0";
                    document.getElementById(`${tableId}-multi-${rIdx}`).innerText = "0";
                    document.getElementById(`${tableId}-single-${rIdx}`).innerText = "0";
                    document.getElementById(`${tableId}-total-${rIdx}`).innerText = "0";
                });
                document.getElementById(`${tableId}-grandTotal`).innerText = "0";
                return;
            }

            const baseHourly = capacity / effectiveHours;

            data.forEach((row, rIdx) => {
                const isBreak = row.r === 0;
                let lagrange = 0, multi = 0, single = 0, total = 0;

                if (!isBreak) {
                    lagrange = baseHourly * row.r;
                    const mRate = row.multiPct;
                    const sRate = 1 - mRate;
                    
                    multi = lagrange * mRate;
                    single = lagrange * sRate;
                    total = lagrange * row.dur;
                    grandTotal += total;
                }

                document.getElementById(`${tableId}-lagrange-${rIdx}`).innerText = isBreak ? "-" : formatNumber(lagrange, 2);
                document.getElementById(`${tableId}-multi-${rIdx}`).innerText = isBreak ? "-" : formatNumber(multi, 2);
                document.getElementById(`${tableId}-single-${rIdx}`).innerText = isBreak ? "-" : formatNumber(single, 2);
                document.getElementById(`${tableId}-total-${rIdx}`).innerText = isBreak ? "-" : formatNumber(total, 0);
            });

            document.getElementById(`${tableId}-grandTotal`).innerText = formatNumber(grandTotal, 0);
        }

        function formatNumber(num, decimals) {
            return num.toLocaleString('tr-TR', { 
                minimumFractionDigits: decimals, 
                maximumFractionDigits: decimals 
            });
        }
    </script>
</body>
</html>
